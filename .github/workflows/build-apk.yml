name: Build DebugX APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build Android Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Grant Execute Permissions to Gradle Wrapper
        run: chmod +x android/gradlew

      - name: Build Debug APK with Gradle
        working-directory: android
        run: |
          ./gradlew assembleDebug --stacktrace --no-daemon 2>&1 | tee ../gradle-build.log

      - name: Upload Build Log on Failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: gradle-build-log
          path: gradle-build.log

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: DebugX-v1.0.0-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30

      - name: Create GitHub Release with APK
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: v1.0.0
          name: "DebugX v1.0.0 (Android APK)"
          body: |
            ### 🚀 DebugX Android APK Release

            **Find the Bug. Understand the Cause. Fix with Confidence.**

            #### 📲 Download & Install
            Download **`app-debug.apk`** below to install on your Android phone or emulator:
            - **Package:** `com.debugx.app`
            - **Target SDK:** Android 14 (API 34)
            - **Min SDK:** Android 8.0 (API 26)
            - **Built with:** Kotlin, Jetpack Compose, Material 3, Google Gemini AI SDK
          files: android/app/build/outputs/apk/debug/app-debug.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
