name: Build DebugX APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build Android Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Grant Execute Permissions to Gradle Wrapper
        run: chmod +x android/gradlew

      - name: Configure google-services.json for CI
        run: |
          if [ ! -f "android/app/google-services.json" ]; then
            cat << 'EOF' > android/app/google-services.json
            {
              "project_info": {
                "project_number": "987654321098",
                "project_id": "debugx-studio",
                "storage_bucket": "debugx-studio.firebasestorage.app"
              },
              "client": [
                {
                  "client_info": {
                    "mobilesdk_app_id": "1:987654321098:android:1234567890abcdef123456",
                    "android_client_info": {
                      "package_name": "com.debugx.app"
                    }
                  },
                  "oauth_client": [],
                  "api_key": [{ "current_key": "AIzaSyDebugXAndroidCIKeyPlaceholder" }],
                  "services": {}
                },
                {
                  "client_info": {
                    "mobilesdk_app_id": "1:987654321098:android:abcdef1234567890abcdef",
                    "android_client_info": {
                      "package_name": "com.debugx.app.debug"
                    }
                  },
                  "oauth_client": [],
                  "api_key": [{ "current_key": "AIzaSyDebugXAndroidCIKeyPlaceholder" }],
                  "services": {}
                }
              ],
              "configuration_version": "1"
            }
          EOF
          fi

      - name: Build Debug APK with Gradle
        working-directory: android
        run: ./gradlew :app:assembleDebug --stacktrace --no-daemon

      - name: Locate and list generated APK
        run: |
          echo "=== Finding all generated APK files ==="
          find . -name "*.apk" -ls

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: DebugX-v1.3.0-apk
          path: "**/*.apk"
          if-no-files-found: error
          retention-days: 30

      - name: Create GitHub Release with APK
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: v1.3.0
          name: "DebugX v1.3.0 - Firebase Auth & Automatic Gemini Integration (Android APK)"
          body: |
            ### 🚀 DebugX Android APK Release (v1.3.0)

            **Find the Bug. Understand the Cause. Fix with Confidence.**

            #### ✨ What's New in v1.3.0: AUTHENTICATION & AUTOMATIC GEMINI INTEGRATION
            - 🔐 **Google Sign-In with Firebase Auth:** Real Google Authentication via Android Credential Manager.
            - ⚡ **Automatic Gemini AI Connection:** Seamless integration through Firebase AI Logic — zero manual API key entry required!
            - 📊 **Cloud Firestore Persistence:** Secure user profiles (`users/{uid}`) and cloud-synced debugging history.
            - 🛡️ **Production-Grade Security Rules:** Verified user data isolation and DoS protection for Firestore & Cloud Storage.
            - 🧠 **Retains all features:** Explain My Code, AST loop/function visualizers, Live Camera (CameraX), and Multimodal Vision debugging.

            #### 📲 Download & Install
            Download **`app-debug.apk`** below to install on your Android phone or emulator:
            - **Package:** `com.debugx.app`
            - **Target SDK:** Android 14 (API 34)
            - **Min SDK:** Android 8.0 (API 26)
            - **Built with:** Kotlin, Jetpack Compose, CameraX, Firebase Auth, Cloud Firestore, Firebase AI Logic
          files: "**/*.apk"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
