name: Build DebugX APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build Android Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Grant Execute Permissions to Gradle Wrapper
        run: chmod +x android/gradlew

      - name: Build Debug APK with Gradle
        working-directory: android
        run: ./gradlew :app:assembleDebug --stacktrace --no-daemon

      - name: Locate and list generated APK
        run: |
          echo "=== Finding all generated APK files ==="
          find . -name "*.apk" -ls

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: DebugX-v1.2.0-apk
          path: "**/*.apk"
          if-no-files-found: error
          retention-days: 30

      - name: Create GitHub Release with APK
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: v1.2.0
          name: "DebugX v1.2.0 - Explain My Code Feature (Android APK)"
          body: |
            ### 🚀 DebugX Android APK Release (v1.2.0)

            **Find the Bug. Understand the Cause. Fix with Confidence.**

            #### ✨ What's New in v1.2.0: FEATURE 3 — EXPLAIN MY CODE
            - 🧠 **Explain My Code:** Interactive code explanation engine with synchronized line highlighting.
            - 📊 **Loop & Function Visualizers:** Iteration state step-through and call stack frame hierarchy.
            - 🔍 **Variable Tracking:** Identification of data types, scopes, declarations, and usages.
            - ⏱️ **Time & Space Complexity:** Big-O mathematical complexity analysis with detailed reasoning.
            - 🤖 **Ask AI Follow-Up:** Integrated conversational thread to ask questions about code behavior and optimizations.
            - ⚠️ **Honest Static Prediction:** Clear demarcation between statically deduced output and live execution.
            - 🌱 **Beginner & Advanced Modes:** Real-world analogies for beginners or deep AST & memory mechanics for advanced devs.
            - 📸 **Retains all v1.1.0 Live Camera and multimodal debugging features.**

            #### 📲 Download & Install
            Download **`app-debug.apk`** below to install on your Android phone or emulator:
            - **Package:** `com.debugx.app`
            - **Target SDK:** Android 14 (API 34)
            - **Min SDK:** Android 8.0 (API 26)
            - **Built with:** Kotlin, Jetpack Compose, CameraX, Material 3, Google Gemini AI SDK
          files: "**/*.apk"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
