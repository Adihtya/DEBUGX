name: Build DebugX APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build Android Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Grant Execute Permissions to Gradle Wrapper
        run: chmod +x android/gradlew

      - name: Build Debug APK with Gradle
        working-directory: android
        run: ./gradlew :app:assembleDebug --stacktrace --no-daemon

      - name: Locate and list generated APK
        run: |
          echo "=== Finding all generated APK files ==="
          find . -name "*.apk" -ls

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: DebugX-v2.0.0-apk
          path: "**/*.apk"
          if-no-files-found: error
          retention-days: 30

      - name: Create GitHub Release with APK
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: v2.0.0
          name: "DebugX v2.0.0 - Supabase Migration (Auth, Database, Storage & Edge Functions)"
          body: |
            ### 🚀 DebugX Android APK Release (v2.0.0)

            **Find the Bug. Understand the Cause. Fix with Confidence.**

            #### ✨ What's New in v2.0.0: COMPLETE MIGRATION TO SUPABASE
            - 🔐 **Supabase Authentication:** Google Sign-In with Android Credential Manager & Supabase Auth.
            - 🐘 **Supabase PostgreSQL:** Complete database migration with Row Level Security (RLS) on `profiles`, `debugging_history`, and `user_preferences`.
            - 📦 **Supabase Storage:** Isolated private bucket (`debugx-uploads`) for captured error screenshots and camera snaps.
            - ⚡ **Supabase Edge Functions + Gemini 1.5 Flash:** Server-side AI execution with zero client API key exposure.
            - 🛡️ **Zero Firebase Dependencies:** All Firebase SDKs and configuration files completely removed.
            - 🧠 **Retains all features:** Explain My Code, AST loop/function visualizers, Live Camera (CameraX), and Multimodal Vision debugging.

            #### 📲 Download & Install
            Download **`app-debug.apk`** below to install on your Android phone or emulator:
            - **Package:** `com.debugx.app`
            - **Target SDK:** Android 14 (API 34)
            - **Min SDK:** Android 8.0 (API 26)
            - **Built with:** Kotlin, Jetpack Compose, CameraX, Supabase Auth, PostgreSQL, Supabase Edge Functions & Gemini 1.5 Flash
          files: "**/*.apk"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
